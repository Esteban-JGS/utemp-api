spring.application.name=UTEMP_Project

# Every secret comes from the environment (see .env.example). Nothing sensitive lives in this file.

# PostgreSQL
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# Schema is owned by Flyway (src/main/resources/db/migration); Hibernate only validates it
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Mail (SMTP)
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2

# File storage: uploaded files are saved under generated names inside this directory
file.storage.base-path=${FILE_STORAGE_PATH:storage/files}
# Largest file a student can upload
file.storage.max-file-size=${FILE_MAX_SIZE:20MB}

# JWT. The secret must be at least 32 bytes; the app refuses to start otherwise.
jwt.secret=${JWT_SECRET}
# 15 minutes
jwt.expiration.access=${JWT_EXPIRATION_ACCESS:900000}
# 7 days
jwt.expiration.refresh=${JWT_EXPIRATION_REFRESH:604800000}

# Actuator: only expose the health check
management.endpoints.web.exposure.include=health
# Mail is optional for local runs, so it should not mark the app as DOWN
management.health.mail.enabled=false

# Logging
logging.level.root=INFO
logging.level.org.hibernate=ERROR
logging.level.org.una.programmingIII=INFO
